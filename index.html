<!DOCTYPE html>
<html lang="es" data-view="fingering" data-route="home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a2a1c">
<title>Ocarina Songbook</title>
<link rel="icon" type="image/png" href="src/img/ocarina_title.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="src/img/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ocarina">
<link rel="stylesheet" href="css/styles.css?v=37fb708f">
</head>
<body>
<svg id="fingering-sprite" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs id="fingering-defs"></defs>
</svg>
<div class="wrap">

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Ocarina Songbook: ir a la lista de canciones">
      <img class="logo" src="src/img/ocarina_title.png" alt="" width="50" height="50">
      <div class="brand-text">
        <h1>Ocarina Songbook</h1>
        <p class="brand-tag">Notas y digitación para practicar</p>
      </div>
    </a>
    <div class="toolbar" hidden>
      <div class="folder-slot" id="folder-slot"></div>
      <button type="button" class="mode-toggle" id="lang-toggle" aria-label="Switch to English" title="Switch to English">
        <img src="src/svg/spain.png" alt="" width="18" height="18"><span>Español</span>
      </button>
      <button type="button" class="mode-toggle" id="mode-toggle" aria-label="Modo oscuro" aria-pressed="false" title="Cambiar entre tema claro y oscuro">
        <span id="mode-icon" data-icon="light_mode"></span><span id="mode-label">Claro</span>
      </button>
      <div class="picker" id="theme-picker">
        <button type="button" aria-label="Color del tema" aria-expanded="false" aria-controls="theme-menu">
          <span data-icon="theme"></span><span>Color</span>
        </button>
        <div class="menu" id="theme-menu" hidden></div>
      </div>
      <div class="picker" id="font-picker">
        <button type="button" aria-label="Fuente" aria-expanded="false" aria-controls="font-menu">
          <span data-icon="font"></span><span>Fuente</span>
        </button>
        <div class="menu" id="font-menu" hidden></div>
      </div>
      <div class="picker" id="background-picker">
        <button type="button" aria-label="Fondo de la página" aria-expanded="false" aria-controls="background-menu">
          <span data-icon="image"></span><span>Fondo</span>
        </button>
        <div class="menu menu--wide" id="background-menu" hidden></div>
      </div>
      <a class="mode-toggle" id="fingering-button" href="#/digitaciones" title="Ver las digitaciones de todas las notas">
        <span data-icon="digitalization"></span><span>Digitaciones</span>
      </a>
      <div class="metro-split">
        <button type="button" class="mode-toggle metro-open" id="metronome-button" aria-label="Abrir el metrónomo" title="Abrir el metrónomo">
          <span data-icon="metronome"></span><span>Metrónomo</span>
        </button>
        <button type="button" class="mode-toggle metro-run" id="metronome-run" aria-label="Iniciar el metrónomo" aria-pressed="false" title="Iniciar el metrónomo">
          <span data-icon="play"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="viewbar no-print">
      <div class="segmented" id="view-switch" role="radiogroup" aria-label="Mostrar las notas como">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <label><input type="radio" name="view" value="names"><span>Nombre</span></label>
        <label><input type="radio" name="view" value="fingering"><span>Digitación</span></label>
        <label><input type="radio" name="view" value="both"><span>Ambas</span></label>
      </div>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="note" data-solfege="Fa">Fa</span> octava media</span>
      <span class="legend-item"><span class="note note--low"><span class="note-label"><span data-solfege="Fa">Fa</span><span class="note-oct">,</span></span></span> grave</span>
      <span class="legend-item"><span class="note note--high"><span class="note-label"><span data-solfege="Fa">Fa</span><span class="note-oct">'</span></span></span> aguda</span>
      <span class="legend-item"><span class="note note--sharp"><span class="note-label"><span data-solfege="Fa">Fa</span><span class="note-acc">&#9839;</span></span></span> sostenido</span>
      <span class="legend-item"><span class="note note--flat"><span class="note-label"><span data-solfege="Si">Si</span><span class="note-acc">&#9837;</span></span></span> bemol</span>
    </div>

    <noscript><p class="empty">Esta página necesita JavaScript para mostrar las canciones.</p></noscript>
    <div class="empty" id="empty" hidden></div>
    <div id="songs"></div>
  </main>

  <footer class="site-footer">
    <span>Ocarina Songbook &middot; cancionero personal para practicar con la ocarina</span>
    <span class="footer-tools no-print">
      <button type="button" class="link-button" id="install-button" title="Instalar la página como una aplicación, para abrirla sin conexión" hidden>Instalar la aplicación</button>
      <button type="button" class="link-button" id="backup-export" title="Guardar todas las canciones y digitaciones en un archivo" hidden>Exportar copia</button>
      <button type="button" class="link-button" id="backup-import" title="Añadir las canciones de una copia guardada" hidden>Importar copia</button>
      <input type="file" id="backup-file" accept="application/json,.json" hidden>
    </span>
    <span id="footer-count"></span>
  </footer>

</div>
<dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title" data-role="title"></h2>
    <p data-role="text"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" value="cancel" autofocus>Cancelar</button>
      <button type="button" class="btn btn--danger" value="ok">Aceptar</button>
    </div>
  </form>
</dialog>

<dialog class="dialog dialog--wide" id="key-dialog" aria-labelledby="key-title">
  <form method="dialog" onsubmit="return false">
    <h2 id="key-title" data-role="title"></h2>
    <p data-role="help"></p>
    <div class="key-types" data-role="types" role="group" aria-label="Alteraciones de la canción"></div>
    <p class="key-preview" data-role="preview" role="status"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-role="cancel">Cancelar</button>
      <button type="button" class="btn btn--primary" data-role="ok" disabled>Aceptar</button>
    </div>
  </form>
</dialog>

<dialog class="dialog dialog--export" id="export-dialog" aria-label="Exportar la canción"></dialog>

<dialog class="dialog dialog--transpose" id="transpose-dialog" aria-label="Transportar la canción"></dialog>

<dialog class="dialog dialog--import" id="import-dialog" aria-label="Importar un MIDI"></dialog>

<dialog class="dialog dialog--fingering" id="fingering-dialog" aria-label="Editar las digitaciones"></dialog>

<dialog class="dialog dialog--metronome" id="metronome-dialog" aria-label="Metrónomo"></dialog>

<div class="dock-root" id="dock-root"></div>

<div class="toast no-print" id="toast" role="status" hidden></div>

<script src="js/i18n.js?v=a65ef67b"></script>
<script src="js/notes.js?v=5ecc671f"></script>
<script src="js/keys.js?v=bfc69fc7"></script>
<script src="js/fingering.js?v=7f323d44"></script>
<script src="js/icons.js?v=138fa6bb"></script>
<script src="js/categories.js?v=e4b6179c"></script>
<script src="js/ui.js?v=81b71ef0"></script>
<script src="js/menus.js?v=81224562"></script>
<script src="js/store.js?v=a6adb113"></script>
<script src="js/router.js?v=cafb81aa"></script>
<script src="js/home.js?v=75d3bbf1"></script>
<script src="js/key-dialog.js?v=051c6c0b"></script>
<script src="js/transpose.js?v=ca121f5f"></script>
<script src="js/audio-import.js?v=50b1eca6"></script>
<script src="js/midi-import.js?v=f2ad533b"></script>
<script src="js/pitch.js?v=86aaca49"></script>
<script src="js/metronome.js?v=b88cab87"></script>
<script src="js/audio.js?v=fca93399"></script>
<script src="js/ocarina-image.js?v=23627725"></script>
<script src="js/score-image.js?v=647e380d"></script>
<script src="js/export.js?v=bba5ee3e"></script>
<script src="js/player.js?v=c0f48d0c"></script>
<script src="js/render.js?v=1bc6040a"></script>
<script src="js/editor.js?v=f2659d3b"></script>
<script src="js/folder.js?v=bc073a36"></script>
<script src="js/background.js?v=1efc275c"></script>
<script src="js/preferences.js?v=672522c2"></script>
<script src="js/fingering-editor.js?v=225b2afc"></script>
<script src="js/fingering-page.js?v=0c6c6b65"></script>
<script src="js/backup.js?v=002a093d"></script>
<script src="js/pwa.js?v=e09ce499"></script>
<script src="js/app.js?v=b48c4c60"></script>
</body>
</html>
